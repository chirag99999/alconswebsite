<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALCONS — Admin Leads & Backend Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --panel: #1E293B;
      --border: #334155;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #0FD8D4;
      --accent-glow: rgba(15, 216, 212, 0.15);
      --red: #EF4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 32px 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
    h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    h1 span { color: var(--accent); }
    .btn { background: var(--accent); color: #0F172A; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Login Form */
    #loginCard { max-width: 400px; margin: 80px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .field input { width: 100%; background: #0F172A; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .field input:focus { border-color: var(--accent); }

    /* Table */
    .table-container { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #0F172A; padding: 16px 20px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>ALCONS<span>.</span> Backend Portal</h1>
      <div id="authStatus">
        <button id="logoutBtn" class="btn" style="display:none; background: #334155; color: #fff;">Sign Out</button>
      </div>
    </header>

    <!-- Login View -->
    <div id="loginCard">
      <h2 style="margin-bottom: 20px; font-size: 18px;">Admin Sign In</h2>
      <form id="loginForm">
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="adminEmail" placeholder="admin@alcons.in" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
      </form>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" style="display: none;">
      <div style="display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px;">
        <button id="tabLeadsBtn" class="btn" style="background: var(--accent); color: #0F172A;">Enquiry Leads (<span id="leadCount">0</span>)</button>
        <button id="tabOrdersBtn" class="btn" style="background: #334155; color: #fff;">Paid Orders &amp; Customizations (<span id="orderCount">0</span>)</button>
      </div>

      <!-- Leads Section -->
      <div id="leadsSection">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>Client Enquiry Leads</h2>
          <button id="refreshLeads" class="btn">Refresh Leads</button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Project Type</th>
                <th>Message</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody">
              <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading enquiries...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Paid Orders Section -->
      <div id="ordersSection" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>Razorpay Paid Orders &amp; Customizations</h2>
          <button id="refreshOrders" class="btn">Refresh Orders</button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Client</th>
                <th>Contact</th>
                <th>Plan Item</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Razorpay Payment ID</th>
                <th>Customization Brief</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Loading paid orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginCard = document.getElementById('loginCard');
      const dashboardView = document.getElementById('dashboardView');
      const logoutBtn = document.getElementById('logoutBtn');
      const leadsTableBody = document.getElementById('leadsTableBody');
      const leadCount = document.getElementById('leadCount');
      const ordersTableBody = document.getElementById('ordersTableBody');
      const orderCount = document.getElementById('orderCount');
      const leadsSection = document.getElementById('leadsSection');
      const ordersSection = document.getElementById('ordersSection');
      const tabLeadsBtn = document.getElementById('tabLeadsBtn');
      const tabOrdersBtn = document.getElementById('tabOrdersBtn');

      // Tab switcher
      tabLeadsBtn.addEventListener('click', () => {
        tabLeadsBtn.style.background = 'var(--accent)';
        tabLeadsBtn.style.color = '#0F172A';
        tabOrdersBtn.style.background = '#334155';
        tabOrdersBtn.style.color = '#fff';
        leadsSection.style.display = 'block';
        ordersSection.style.display = 'none';
      });

      tabOrdersBtn.addEventListener('click', () => {
        tabOrdersBtn.style.background = 'var(--accent)';
        tabOrdersBtn.style.color = '#0F172A';
        tabLeadsBtn.style.background = '#334155';
        tabLeadsBtn.style.color = '#fff';
        leadsSection.style.display = 'none';
        ordersSection.style.display = 'block';
        loadOrders();
      });

      // Check Auth State
      const checkAuth = setInterval(() => {
        if (window.AlconsFirebase && window.AlconsFirebase.auth) {
          clearInterval(checkAuth);
          window.AlconsFirebase.onAuthStateChanged(window.AlconsFirebase.auth, (user) => {
            if (user) {
              loginCard.style.display = 'none';
              dashboardView.style.display = 'block';
              logoutBtn.style.display = 'block';
              loadLeads();
              loadOrders();
            } else {
              loginCard.style.display = 'block';
              dashboardView.style.display = 'none';
              logoutBtn.style.display = 'none';
            }
          });
        }
      }, 100);

      // Login Submission
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const pass = document.getElementById('adminPass').value;

        try {
          await window.AlconsFirebase.signInWithEmailAndPassword(window.AlconsFirebase.auth, email, pass);
        } catch (err) {
          alert('Sign in failed: ' + err.message);
        }
      });

      // Logout
      logoutBtn.addEventListener('click', () => {
        window.AlconsFirebase.signOut(window.AlconsFirebase.auth);
      });

      // Load Leads
      async function loadLeads() {
        leadsTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading enquiries...</td></tr>';
        const leads = await window.AlconsFirebase.fetchLeadsFromFirestore();
        leadCount.textContent = leads.length;

        if (leads.length === 0) {
          leadsTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No enquiries found yet.</td></tr>';
          return;
        }

        leadsTableBody.innerHTML = leads.map(l => `
          <tr>
            <td>${l.submitted_at ? new Date(l.submitted_at).toLocaleDateString() : 'N/A'}</td>
            <td><strong>${escapeHtml(l.full_name || '')}</strong></td>
            <td><a href="mailto:${escapeHtml(l.email || '')}" style="color: var(--accent);">${escapeHtml(l.email || '')}</a></td>
            <td>${escapeHtml(l.phone || 'N/A')}</td>
            <td><span class="badge">${escapeHtml(l.project_type || 'General')}</span></td>
            <td>${escapeHtml(l.message || '')}</td>
          </tr>
        `).join('');
      }

      // Load Paid Orders
      async function loadOrders() {
        ordersTableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Loading paid orders...</td></tr>';
        
        let orders = [];
        try {
          if (window.AlconsFirebase && typeof window.AlconsFirebase.fetchOrdersFromFirestore === 'function') {
            orders = await window.AlconsFirebase.fetchOrdersFromFirestore();
          }
        } catch (err) {
          console.warn('Remote fetch failed, loading local orders:', err);
        }

        // Merge with local storage if not already present
        const localOrders = JSON.parse(localStorage.getItem('alcons_paid_orders') || '[]');
        localOrders.forEach(lo => {
          if (!orders.some(o => o.razorpay_payment_id === lo.razorpay_payment_id)) {
            orders.push(lo);
          }
        });

        orderCount.textContent = orders.length;

        if (orders.length === 0) {
          ordersTableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">No paid orders yet.</td></tr>';
          return;
        }

        ordersTableBody.innerHTML = orders.map(o => {
          const isDownload = o.order_type === 'plan_pdf_download';
          const typeBadge = isDownload
            ? `<span class="badge" style="background: rgba(15,216,212,0.15); border-color: #0FD8D4; color: #0FD8D4;">Download Blueprint</span>`
            : `<span class="badge" style="background: rgba(234,179,8,0.15); border-color: #EAB308; color: #FACC15;">Plan Customization</span>`;

          const custBrief = o.customization_data 
            ? `Plot: ${escapeHtml(o.customization_data.plotDimensions || 'N/A')} | Notes: ${escapeHtml(o.customization_data.notes || 'None')}`
            : 'Standard instant blueprint package';

          const dateStr = o.created_at_iso ? new Date(o.created_at_iso).toLocaleString() : (o.created_at ? new Date(o.created_at.seconds * 1000).toLocaleString() : 'N/A');

          return `
            <tr>
              <td>${dateStr}</td>
              <td><strong>${escapeHtml(o.client_name || '')}</strong></td>
              <td>
                <a href="mailto:${escapeHtml(o.client_email || '')}" style="color: var(--accent);">${escapeHtml(o.client_email || '')}</a><br>
                <small style="color: var(--text-muted);">${escapeHtml(o.client_phone || '')}</small>
              </td>
              <td><strong>${escapeHtml(o.plan_title || '')}</strong><br><small style="color:var(--text-muted);">${escapeHtml(o.plan_size || '')}</small></td>
              <td>${typeBadge}</td>
              <td><strong style="color:var(--accent);">₹${escapeHtml(String(o.amount || '0'))}</strong></td>
              <td><code style="background:#0F172A; padding:4px 8px; border-radius:4px; font-size:12px; border:1px solid var(--border);">${escapeHtml(o.razorpay_payment_id || '')}</code></td>
              <td style="max-width:200px; font-size:12px; color:var(--text-muted);">${custBrief}</td>
            </tr>
          `;
        }).join('');
      }

      document.getElementById('refreshLeads').addEventListener('click', loadLeads);
      document.getElementById('refreshOrders').addEventListener('click', loadOrders);

      function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }
    });
  </script>
</body>

</html>
